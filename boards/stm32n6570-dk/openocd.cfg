# OpenOCD configuration for STM32N6570-DK
# On-board ST-LINK-V3EC via SWD
#
# Requires an OpenOCD build with tcl/target/stm32n6x.cfg (not yet in a
# packaged release as of 2026-08 — see scripts/build-openocd.sh, which builds
# one into external/openocd/).
#
# transport must be plain "swd", not "hla_swd": stm32n6x.cfg debugs this chip
# in TrustZone Secure state, which the ST-Link's HLA (high-level adapter)
# protocol does not support — only raw SWD does. The V3EC on this board
# supports raw SWD.

source [find interface/stlink.cfg]
transport select swd

source [find target/stm32n6x.cfg]
